[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tracelab"
version = "0.1.0"
description = "Captured-input provenance debugging for Hermes tool binding and session isolation failures."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Himekaovo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
